<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EFE8">
<title>Cat's Room</title>
<meta name="description" content="A room with a ...">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23211E1B'/%3E%3Crect x='4' y='6' width='2' height='2' fill='%23E8B94A'/%3E%3Crect x='10' y='6' width='2' height='2' fill='%23E8B94A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@400;500;600&family=Tiny5&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- ============ SETUP ============ -->
<section id="setup" class="setup" hidden>
  <div class="setup-card">
    <div class="setup-head">
      <p class="eyebrow" data-i18n="setup.eyebrow"></p>
      <div class="lang" id="langSetup" role="group" aria-label="Language"></div>
    </div>
    <h1 data-i18n="setup.title"></h1>
    <p class="lede" data-i18n="setup.lede"></p>

    <div class="field">
      <label class="lbl" for="catName" data-i18n="setup.nameLabel"></label>
      <div class="row">
        <input id="catName" type="text" maxlength="16" autocomplete="off">
        <button id="randomName" class="ghost-btn" type="button" data-i18n="setup.random"></button>
      </div>
    </div>

    <div class="field">
      <span class="lbl" data-i18n="setup.eyeLabel"></span>
      <div class="swatches" id="eyeSwatches"></div>
    </div>

    <div class="field">
      <span class="lbl" data-i18n="setup.collarLabel"></span>
      <div class="swatches" id="collarSwatches"></div>
    </div>

    <button id="startBtn" class="primary-btn" type="button" data-i18n="setup.go"></button>
  </div>
</section>

<!-- ============ ROOM ============ -->
<main id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <span id="brandName"></span>
    </div>
    <div class="tools">
      <div class="lang" id="langCtl" role="group" aria-label="Language"></div>
      <button id="muteBtn" class="icon-btn" type="button" aria-pressed="false">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <button hidden id="changeCat" class="link-btn" type="button" data-i18n="ui.changeCat"></button>
    </div>
  </header>

  <div class="stage">
    <div class="frame">
      <canvas id="scene"></canvas>
      <button id="helpBtn" class="book-btn px-art" type="button" aria-haspopup="dialog"></button>
      <div id="hearts" class="hearts" role="img"></div>
      <div id="loading" class="loading"><span data-i18n="ui.loading"></span></div>
    </div>
    <p class="sr" id="status" aria-live="polite"></p>
  </div>

  <div class="controls">
    <button id="sneezeBtn" class="action-btn" type="button" data-i18n="ui.sneeze"></button>
    <button id="treatBtn" class="action-btn primary" type="button" data-i18n="ui.treat"></button>
  </div>

</main>

<!-- ============ PIXEL PAGES (filled by js/hud.js) ============ -->
<dialog id="helpDlg" class="px-dlg help-dlg" aria-labelledby="helpTitle"><div class="book"></div></dialog>
<dialog id="foundDlg" class="px-dlg found-dlg" aria-labelledby="foundTitle"><div class="found-card"></div></dialog>

<noscript><p style="padding:24px;font-family:sans-serif">This page needs JavaScript.</p></noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
